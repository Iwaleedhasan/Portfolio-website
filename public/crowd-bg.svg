<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%" preserveAspectRatio="xMidYMax slice">
  <defs>
    <style>
      .crowd-line { stroke: #141414; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: #FFFFFF; }
      .crowd-dark { fill: #141414; }
      .crowd-hair { fill: #202020; }
    </style>
  </defs>

  <!-- Left Cluster 1 -->
  <g transform="translate(60, 90)">
    <!-- Person 1 -->
    <circle cx="50" cy="50" r="30" class="crowd-line"/>
    <path d="M 30,35 Q 50,15 70,35 Q 80,10 50,10 Q 20,10 30,35 Z" class="crowd-hair"/>
    <circle cx="42" cy="50" r="3" class="crowd-dark"/>
    <circle cx="58" cy="50" r="3" class="crowd-dark"/>
    <path d="M 46,65 Q 50,70 54,65" stroke="#141414" stroke-width="2" fill="none"/>
    <path d="M 10,130 C 10,80 90,80 90,130 L 90,300 L 10,300 Z" class="crowd-line"/>
    <!-- Person 2 -->
    <circle cx="130" cy="70" r="28" class="crowd-line"/>
    <circle cx="122" cy="70" r="3" class="crowd-dark"/>
    <circle cx="138" cy="70" r="3" class="crowd-dark"/>
    <path d="M 90,140 C 90,100 170,100 170,140 L 170,300 L 90,300 Z" class="crowd-line"/>
    <path d="M 100,55 Q 130,35 160,55" class="crowd-hair"/>
  </g>

  <!-- Cluster 2 -->
  <g transform="translate(320, 80)">
    <!-- Person 3 (Student with glasses) -->
    <circle cx="60" cy="45" r="28" class="crowd-line"/>
    <rect x="42" y="38" width="14" height="12" rx="3" fill="none" stroke="#141414" stroke-width="2"/>
    <rect x="64" y="38" width="14" height="12" rx="3" fill="none" stroke="#141414" stroke-width="2"/>
    <line x1="56" y1="44" x2="64" y2="44" stroke="#141414" stroke-width="2"/>
    <path d="M 20,120 C 20,75 100,75 100,120 L 100,300 L 20,300 Z" class="crowd-line"/>
    <!-- Person 4 -->
    <circle cx="150" cy="60" r="30" class="crowd-line"/>
    <path d="M 110,135 C 110,90 190,90 190,135 L 190,300 L 110,300 Z" class="crowd-line"/>
    <path d="M 125,45 Q 150,20 175,45 Z" class="crowd-dark"/>
  </g>

  <!-- Cluster 3 (Behind center character) -->
  <g transform="translate(680, 100)">
    <circle cx="30" cy="40" r="26" class="crowd-line"/>
    <circle cx="24" cy="40" r="2.5" class="crowd-dark"/>
    <circle cx="36" cy="40" r="2.5" class="crowd-dark"/>
    <path d="M 0,110 C 0,68 60,68 60,110 L 60,300 L 0,300 Z" class="crowd-line"/>

    <circle cx="190" cy="40" r="26" class="crowd-line"/>
    <circle cx="184" cy="40" r="2.5" class="crowd-dark"/>
    <circle cx="196" cy="40" r="2.5" class="crowd-dark"/>
    <path d="M 160,110 C 160,68 220,68 220,110 L 220,300 L 160,300 Z" class="crowd-line"/>
  </g>

  <!-- Cluster 4 -->
  <g transform="translate(1040, 75)">
    <circle cx="60" cy="55" r="29" class="crowd-line"/>
    <path d="M 35,42 Q 60,20 85,42 Z" class="crowd-hair"/>
    <circle cx="52" cy="55" r="3" class="crowd-dark"/>
    <circle cx="68" cy="55" r="3" class="crowd-dark"/>
    <path d="M 20,130 C 20,85 100,85 100,130 L 100,300 L 20,300 Z" class="crowd-line"/>

    <circle cx="150" cy="65" r="27" class="crowd-line"/>
    <circle cx="142" cy="65" r="2.5" class="crowd-dark"/>
    <circle cx="158" cy="65" r="2.5" class="crowd-dark"/>
    <path d="M 115,140 C 115,95 185,95 185,140 L 185,300 L 115,300 Z" class="crowd-line"/>
  </g>

  <!-- Cluster 5 -->
  <g transform="translate(1320, 85)">
    <circle cx="50" cy="50" r="28" class="crowd-line"/>
    <circle cx="42" cy="50" r="3" class="crowd-dark"/>
    <circle cx="58" cy="50" r="3" class="crowd-dark"/>
    <path d="M 10,125 C 10,80 90,80 90,125 L 90,300 L 10,300 Z" class="crowd-line"/>

    <circle cx="140" cy="60" r="30" class="crowd-line"/>
    <path d="M 100,135 C 100,90 180,90 180,135 L 180,300 L 100,300 Z" class="crowd-line"/>
  </g>

  <!-- Baseline sidewalk line -->
  <line x1="0" y1="395" x2="1600" y2="395" stroke="#141414" stroke-width="4"/>
</svg>
